<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Application</h1>
    <p>Thanks you for your interest in our application!</p>

    <form>
        <!-- Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required> <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required> <br><br>

        <!-- Age -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="0"> <br><br>

        <!-- Gender -->
        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select> <br><br>

        <!-- Radio Buttons -->
        <label>Gender:<br></label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <!-- Checkbox -->
        <label>References?<br></label>
            <input type="checkbox" id="Friend" name="References" value="Friend">
            <label for="Friend">Friend</label><br>
            <input type="checkbox" id="Family" name="References" value="Family">
            <label for="Family">Family</label><br>
            <input type="checkbox" id="Colleague" name="References" value="Colleague">
            <label for="Colleague">Colleague</label><br><br>

        <!-- Dropdown -->
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="another">Another</option>
            <option value="cambodia">Cambodia</option>
            <option value="vietnam">Youn</option>
            <option value="thailand">Theif</option>
            <option value="laos">Laos</option>
        </select> <br><br>

        <!-- Message -->
        <label for="message">Any Comments?</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
